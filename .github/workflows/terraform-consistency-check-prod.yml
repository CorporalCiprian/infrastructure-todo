on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
jobs:
  terraform_plan:
    uses: CorporalCiprian/todo-template/.github/workflows/terraform-consistency-check.yml@main
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID}}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    with:
      env: "prod"